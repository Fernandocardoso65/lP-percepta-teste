<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo | Percepta</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --verde: #56c50f;
            --verde-escuro: #45a30b;
            --preto: #0d0d0d;
            --card: #181818;
            --card-claro: #202020;
            --borda: #2c2c2c;
            --texto-secundario: #9b9b9b;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--preto);
            color: #fff;
        }

        .container {
            width: calc(100% - 40px);
            max-width: 1300px;
            margin: 50px auto;
        }

        /* ===============================
           LOGIN
           =============================== */

        .login {
            width: calc(100% - 40px);
            max-width: 420px;
            margin: 100px auto;
            background: var(--card);
            padding: 35px;
            border-radius: 18px;
            border: 1px solid var(--borda);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .login h1 {
            color: var(--verde);
            margin: 0 0 8px;
            font-size: 32px;
        }

        .login h2 {
            margin: 0 0 28px;
            font-size: 21px;
            font-weight: 500;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 15px;

            border: 1px solid #444;
            border-radius: 9px;

            background: #252525;
            color: white;

            font-size: 15px;
            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input:focus {
            border-color: var(--verde);
            box-shadow: 0 0 0 3px rgba(86, 197, 15, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 9px;

            background: var(--verde);
            color: #111;

            font-weight: 700;
            font-size: 15px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 0 20px rgba(86, 197, 15, 0.25);
        }

        button:active {
            transform: scale(0.98);
        }

        /* ===============================
           SENHA
           =============================== */

        .campo-senha {
            position: relative;
        }

        .campo-senha input {
            padding-right: 55px;
        }

        .mostrar-senha {
            position: absolute;

            right: 8px;
            top: 5px;

            width: 42px;
            height: 36px;

            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;
            color: white;

            border: none;

            font-size: 18px;

            cursor: pointer;
            box-shadow: none;
        }

        .mostrar-senha:hover {
            transform: none;
            background: transparent;
            box-shadow: none;
        }

        .erro {
            color: #ff6767;
            margin: 15px 0 0;
            font-size: 14px;
        }

        /* ===============================
           PAINEL
           =============================== */

        #painel {
            display: none;
        }

        .topo {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            gap: 30px;
            margin-bottom: 35px;
        }

        .topo h1 {
            margin: 16px 0 6px;
            font-size: 34px;
        }

        .topo p {
            margin: 0;
            color: var(--texto-secundario);
        }

        .acoes-topo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .acoes-topo button {
            width: auto;
            padding: 11px 24px;
        }

        /* ===============================
           VOLTAR
           =============================== */

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 9px 16px;

            border: 1px solid rgba(86, 197, 15, 0.4);
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.04);

            color: #fff;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition:
                transform 0.2s ease,
                color 0.2s ease,
                background 0.2s ease;
        }

        .btn-voltar:hover {
            background: var(--verde);
            color: #111;
            transform: translateX(-3px);
        }

        /* ===============================
           RESUMO
           =============================== */

        .resumo {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            background: var(--card);
            border: 1px solid var(--borda);
            border-radius: 14px;

            padding: 18px 22px;
            margin-bottom: 20px;
        }

        .resumo strong {
            color: var(--verde);
            font-size: 24px;
        }

        .resumo span {
            color: var(--texto-secundario);
            font-size: 14px;
        }

        /* ===============================
           TABELA
           =============================== */

        .tabela-leads {
            width: 100%;

            border: 1px solid var(--borda);
            border-radius: 14px;

            overflow: hidden;

            background: var(--card);
        }

        .lead-cabecalho,
        .lead {
            display: grid;

            grid-template-columns:
                minmax(140px, 1.1fr)
                minmax(200px, 1.5fr)
                minmax(130px, 1fr)
                minmax(180px, 1.4fr)
                minmax(160px, 1fr);

            gap: 18px;
            align-items: center;
        }

        .lead-cabecalho {
            padding: 16px 20px;

            background: #222;
            border-bottom: 1px solid var(--borda);

            color: var(--verde);

            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .lead {
            padding: 18px 20px;

            border-bottom: 1px solid var(--borda);

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .lead:last-child {
            border-bottom: none;
        }

        .lead:hover {
            background: var(--card-claro);
        }

        .lead-celula {
            min-width: 0;
        }

        .lead-celula strong {
            display: none;
        }

        .lead-celula span {
            display: block;

            color: #ddd;

            font-size: 14px;
            line-height: 1.4;

            overflow-wrap: anywhere;
        }

        .lead .nome span {
            color: #fff;
            font-weight: 700;
        }

        .lead .data span {
            color: #aaa;
            font-size: 13px;
        }

        .vazio,
        .carregando {
            padding: 35px;
            text-align: center;
            color: #aaa;
        }

        /* ===============================
           MOBILE
           =============================== */

        @media (max-width: 800px) {

            .container {
                width: calc(100% - 28px);
                margin: 30px auto;
            }

            .topo {
                flex-direction: column;
                align-items: stretch;
            }

            .topo h1 {
                font-size: 28px;
            }

            .acoes-topo {
                width: 100%;
            }

            .acoes-topo button {
                width: 100%;
            }

            .btn-voltar {
                width: 100%;
                justify-content: center;
            }

            .resumo {
                align-items: flex-start;
                flex-direction: column;
            }

            .tabela-leads {
                background: transparent;
                border: none;
                overflow: visible;
            }

            .lead-cabecalho {
                display: none;
            }

            .lead {
                display: flex;
                flex-direction: column;

                gap: 12px;

                padding: 20px;
                margin-bottom: 14px;

                border: 1px solid var(--borda);
                border-radius: 14px;

                background: var(--card);
            }

            .lead-celula {
                width: 100%;
            }

            .lead-celula strong {
                display: block;

                margin-bottom: 4px;

                color: var(--verde);

                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.03em;
            }

            .lead-celula span {
                font-size: 15px;
            }

        }

        @media (max-width: 480px) {

            .login {
                margin: 45px auto;
                padding: 25px;
            }

            .login h1 {
                font-size: 28px;
            }

        }
    </style>
</head>

<body>

    <!-- LOGIN -->

    <div class="login" id="login">

        <h1>Percepta</h1>

        <h2>Painel administrativo</h2>

        <form id="form-login">

            <input
                type="email"
                id="email-admin"
                placeholder="E-mail"
                autocomplete="email"
                required
            >

            <div class="campo-senha">

                <input
                    type="password"
                    id="senha-admin"
                    placeholder="Senha"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    id="mostrar-senha"
                    class="mostrar-senha"
                    aria-label="Mostrar senha"
                    title="Mostrar senha"
                >
                    👁
                </button>

            </div>

            <button type="submit">
                Entrar
            </button>

            <p class="erro" id="erro-login"></p>

        </form>

    </div>


    <!-- PAINEL -->

    <main class="container" id="painel">

        <div class="topo">

            <div>

                <a href="index.html" class="btn-voltar">
                    ← Voltar para a Landing
                </a>

                <h1>Contatos recebidos</h1>

                <p>
                    Leads enviados pelos formulários da Landing Page.
                </p>

            </div>

            <div class="acoes-topo">

                <button id="sair">
                    Sair
                </button>

            </div>

        </div>


        <div class="resumo">

            <div>
                <strong id="total-leads">0</strong>
                <br>
                <span>contatos recebidos</span>
            </div>

            <span>
                Ordenação: mais recentes primeiro
            </span>

        </div>


        <div id="lista-leads">

            <div class="carregando">
                Carregando contatos...
            </div>

        </div>

    </main>


    <!-- FIREBASE -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="admin.js"></script>

</body>

</html>
